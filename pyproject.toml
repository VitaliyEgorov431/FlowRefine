[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowrefine"
version = "0.1.0"
description = "CPU-first flowchart generation, critique and refinement research prototype"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "matplotlib>=3.7"]

[project.scripts]
flowrefine = "flowrefine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
